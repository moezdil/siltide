# siltide on every accelerator node: a headless collector that Prometheus
# scrapes and that `siltide --remote` or `nodes:` in a config can attach to.
#
# The image is glibc-based, so the host's /usr must not be mounted over it.
# Only the NVML library is bind-mounted; change its path (/usr/lib64 on RHEL,
# for one) to match the node. Vendor CLIs are read from /opt. Kubernetes correlation uses the
# kubelet log directory and, through the service account, the API server.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: siltide
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: siltide
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"] # events and logs feed describe and logs
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: siltide
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: siltide
subjects:
  - kind: ServiceAccount
    name: siltide
    namespace: monitoring
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: siltide
  namespace: monitoring
  labels:
    app.kubernetes.io/name: siltide
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: siltide
  template:
    metadata:
      labels:
        app.kubernetes.io/name: siltide
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9800"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: siltide
      hostPID: true # see the processes that hold the devices
      hostNetwork: true
      tolerations:
        - operator: Exists
      containers:
        - name: siltide
          image: ghcr.io/moezdil/siltide:latest
          args: ["--service", "--listen", ":9800"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: SILTIDE_STATE_DIR
              value: /var/lib/siltide
            # Uncomment to require a token; generate one with `siltide --gen-token`.
            # - name: SILTIDE_TOKEN
            #   valueFrom:
            #     secretKeyRef: {name: siltide, key: token}
          ports:
            - name: metrics
              containerPort: 9800
          securityContext:
            privileged: true # device nodes and vendor libraries
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: nvml, mountPath: /usr/lib/x86_64-linux-gnu/libnvidia-ml.so.1, readOnly: true}
            - {name: opt, mountPath: /opt, readOnly: true}
            - {name: dev, mountPath: /dev}
            - {name: sys, mountPath: /sys, readOnly: true}
            - {name: pods, mountPath: /var/log/pods, readOnly: true}
            - {name: podres, mountPath: /var/lib/kubelet/pod-resources, readOnly: true}
            - {name: state, mountPath: /var/lib/siltide}
      volumes:
        - {name: nvml, hostPath: {path: /usr/lib/x86_64-linux-gnu/libnvidia-ml.so.1, type: File}}
        - {name: opt, hostPath: {path: /opt}}
        - {name: dev, hostPath: {path: /dev}}
        - {name: sys, hostPath: {path: /sys}}
        - {name: pods, hostPath: {path: /var/log/pods}}
        - {name: podres, hostPath: {path: /var/lib/kubelet/pod-resources}}
        - {name: state, hostPath: {path: /var/lib/siltide, type: DirectoryOrCreate}}
