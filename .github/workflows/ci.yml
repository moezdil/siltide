name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: GOOS=linux go vet ./...
      - name: Tests, with coverage on Linux
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            go test -race -covermode=atomic -coverprofile=cover.out ./...
          else
            go test -race ./...
          fi
      # A floor, not a target. It is what the tree measures today, and it goes
      # up on purpose or not at all: a change that drops coverage should have
      # to say so rather than slip through.
      - name: Coverage floor
        if: runner.os == 'Linux'
        run: |
          set -eu
          go tool cover -func=cover.out | tail -40
          total=$(go tool cover -func=cover.out | awk '/^total:/ {print substr($3, 1, length($3)-1)}')
          floor=64.0
          echo "coverage ${total}%, floor ${floor}%"
          awk -v t="$total" -v f="$floor" 'BEGIN { exit (t >= f) ? 0 : 1 }' ||
            { echo "coverage fell below the floor"; exit 1; }
      - run: go test -run TestFakeNVML -v ./internal/provider/nvidia/
        if: runner.os == 'Linux'
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
      - run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build .
      - run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build .
      - run: GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build .
      - run: go run . --demo --once
      - name: The install script, against a fake release
        if: runner.os == 'Linux'
        run: sh packaging/install/test.sh
      - name: The site pages are consistent
        if: runner.os == 'Linux'
        run: sh scripts/site_test.sh
      # Every command the site and the guide offer to copy, actually run. The
      # download page once handed people a block that read a file it never
      # told them to download, and named one platform's binary; both were
      # obvious the moment anybody ran them, and nobody had.
      # Linux only: these hit the GitHub API unauthenticated, exactly as a
      # reader would, and the macOS runners share addresses that the API rate
      # limits to 403 within seconds.
      - name: The commands the site offers to copy
        if: runner.os == 'Linux'
        run: sh scripts/snippets_test.sh
      - name: The dashboard, against the metrics we export
        if: runner.os == 'Linux'
        run: |
          go build -o bin/siltide .
          sh deploy/compose/dashboard_test.sh
      - run: go test -run xxx -bench . -benchtime 200ms ./internal/collect/ ./internal/tui/
        if: runner.os == 'Linux'
      # What is reachable from our code, not what merely appears in the module
      # graph, which is the difference between a list worth reading and noise.
      - name: govulncheck
        if: runner.os == 'Linux'
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # The packaging only runs on a tag, so without this a bad nfpm entry or a
  # completion that stopped generating is found during a release.
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser reads the tags to name a snapshot
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: latest
          args: check
      - name: Build the packages without publishing them
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: latest
          args: release --snapshot --clean --skip=docker,publish
      - name: Every package we promise is in dist
        run: |
          set -eu
          for ext in deb rpm apk pkg.tar.zst; do
            ls dist/*."$ext" >/dev/null
          done
          ls dist/checksums.txt >/dev/null
          # And the binaries are where the release workflow attests them. They
          # were not, once, and four unattested binaries shipped while the
          # download page told people to verify them.
          n=$(ls -1 dist/*/siltide 2>/dev/null | wc -l | tr -d ' ')
          [ "$n" = 4 ] || { echo "found $n binaries in dist, expected 4"; ls -R dist | head -40; exit 1; }
