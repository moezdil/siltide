name: scorecard

# A weekly look at this repository's own posture: are the actions pinned, are
# workflow tokens least privilege, is the default branch protected, is there a
# security policy, are dependencies current. The findings go to the Security
# tab as SARIF, which turns a vague sense of hygiene into a list with lines.
on:
  branch_protection_rule:
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the findings
      id-token: write # publish the score, with an OIDC token rather than a secret
      contents: read
      actions: read # the token-permissions check reads the workflows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # it only reads; leaving a token here would be a right it has no use for
      # v2.4.0 ran from gcr.io, which now refuses the pull outright ("this API
      # method requires billing to be enabled" on OpenSSF's own project), so
      # every run failed on the image and never reached a check. v2.4.4 ships
      # the same action from ghcr.io.
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: results.sarif
