name: cluster

# The Kubernetes half of siltide against a real API server rather than a
# fixture: pod lookup, container ids, describe and logs. No accelerator is
# needed for any of it, which is why this can run here at all; what still
# needs real devices is issue #16.
on:
  pull_request:
    paths:
      - internal/kube/**
      - internal/collect/**
      - .github/workflows/cluster.yml
  push:
    branches: [main]
    paths:
      - internal/kube/**
      - .github/workflows/cluster.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: siltide
      - name: The cluster is up
        run: kubectl get nodes -o wide
      - name: Kubernetes tests against it
        env:
          SILTIDE_TEST_CLUSTER: "1"
        run: go test ./internal/kube/ -run Cluster -v -count=1
      - name: And the interface starts against it
        run: |
          go build -o bin/siltide .
          ./bin/siltide --once --json | head -c 400
          ./bin/siltide --diagnose-offline | sed -n '/kubernetes/,/providers/p'
