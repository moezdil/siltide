# Every push to main publishes a prerelease named after the next patch
# version and the number of commits since the last stable tag, for example
# `v0.1.3-main.7`, so the newest binaries are always one download away.
name: prerelease
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  prerelease:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      # The same signed statement per artifact that a tagged release gets. The
      # download page tells everyone to run `gh attestation verify`, and until
      # this was here that command answered 404 for every build on main -- which
      # is every build there is before the first stable tag.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: tag
        id: tag
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo v0.0.0)
          n=$(git rev-list --count "${last}..HEAD" 2>/dev/null || git rev-list --count HEAD)
          next=$(echo "$last" | awk -F. '{printf "%s.%s.%d", $1, $2, $3+1}')
          tag="${next}-main.${n}"
          git tag -f "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.tag.outputs.tag }}
      # dist/siltide-* matched nothing: goreleaser keeps each build at
      # dist/siltide_<os>_<arch>/siltide and gives it the published name only
      # on upload. The attest step took the packages, found no binaries, and
      # succeeded, so every binary in v0.1.0 went out unattested while the
      # download page told people to verify it. An empty glob cannot pass
      # quietly again.
      - name: The files to attest are the files that were built
        run: |
          set -eu
          n=$(ls -1 dist/*/siltide 2>/dev/null | wc -l | tr -d ' ')
          [ "$n" = 4 ] || { echo "found $n binaries in dist, expected 4"; ls -R dist | head -40; exit 1; }
          for ext in deb rpm apk pkg.tar.zst; do
            ls dist/*."$ext" >/dev/null
          done
      # Everything published, not only the binaries: a package or an SBOM that
      # cannot be traced back to a run is the gap someone would use.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/*/siltide
            dist/*.deb
            dist/*.rpm
            dist/*.apk
            dist/*.pkg.tar.zst
            dist/*.sbom.json
