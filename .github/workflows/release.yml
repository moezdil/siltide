name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  # A signed statement per artifact saying which workflow, at which commit,
  # produced it. `gh attestation verify` is what reads it.
  id-token: write
  attestations: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The tag that started this run, and not whatever git describe
          # prefers. Every push to main is tagged as a pre-release, so the
          # commit a real release is tagged at already carries a second tag,
          # and v0.1.2-main.1 sorts above v0.1.1: releasing v0.1.1 uploaded
          # its assets onto the pre-release and then failed on the duplicates.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
      # dist/siltide-* matched nothing: goreleaser keeps each build at
      # dist/siltide_<os>_<arch>/siltide and gives it the published name only
      # on upload. The attest step took the packages, found no binaries, and
      # succeeded, so every binary in v0.1.0 went out unattested while the
      # download page told people to verify it. An empty glob cannot pass
      # quietly again.
      - name: The files to attest are the files that were built
        run: |
          set -eu
          n=$(ls -1 dist/*/siltide 2>/dev/null | wc -l | tr -d ' ')
          [ "$n" = 4 ] || { echo "found $n binaries in dist, expected 4"; ls -R dist | head -40; exit 1; }
          for ext in deb rpm apk pkg.tar.zst; do
            ls dist/*."$ext" >/dev/null
          done
      # Everything published, not only the binaries: a package or an SBOM that
      # cannot be traced back to a run is the gap someone would use.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/*/siltide
            dist/*.deb
            dist/*.rpm
            dist/*.apk
            dist/*.pkg.tar.zst
            dist/*.sbom.json

  # After the release is public, so the AUR package points at assets that
  # exist. Split out so a failed publish can be retried by hand without
  # cutting another release.
  aur:
    needs: goreleaser
    if: ${{ !contains(github.ref_name, '-') }}
    uses: ./.github/workflows/aur-publish.yml
    secrets: inherit
    with:
      # github.ref_name is the tag (v1.2.3); the package wants 1.2.3
      version: ${{ github.ref_name }}

  # Tells the tap to render the formula now instead of on its next cron run.
  # GITHUB_TOKEN cannot reach another repository, so this needs a token with
  # Contents: write on moezdil/homebrew-tap.
  tap:
    needs: goreleaser
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - run: gh api repos/moezdil/homebrew-tap/dispatches -f event_type=release
        env:
          GH_TOKEN: ${{ secrets.TAP_DISPATCH_TOKEN }}
