# Dependabot pull requests merge themselves once the required checks pass.
# Nothing is checked out and no pull request code runs here: the job only
# switches auto-merge on, and the branch rules still decide when it happens.
name: dependabot-automerge
on: pull_request_target

permissions:
  contents: read

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - run: gh pr merge --auto --rebase "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
