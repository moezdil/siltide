name: nix
on:
  push:
    branches: [main]
    paths: ["flake.nix", "flake.lock", "go.mod", "go.sum", "**/*.go", ".github/workflows/nix.yml"]
  pull_request:
    paths: ["flake.nix", "flake.lock", "go.mod", "go.sum", "**/*.go", ".github/workflows/nix.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: "experimental-features = nix-command flakes"
      - run: nix build .#siltide --print-build-logs
      - run: ./result/bin/siltide --version
      - run: ./result/bin/siltide --demo --once
      - run: test -f ./result/share/man/man1/siltide.1.gz || test -f ./result/share/man/man1/siltide.1
