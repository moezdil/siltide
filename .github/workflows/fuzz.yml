name: fuzz

# The vendor parsers turn text from outside the host into devices, which makes
# them the one place where someone else's output decides what the collector
# reports. `go test` holds them against captured fixtures and a fixed set of
# mangled variants on every change; this keeps looking, with coverage guiding
# it, for the input nobody wrote down.
#
# Not a required check on purpose: it is path-filtered, and a required check
# that reports nothing on the pull requests it skips blocks the merge.
on:
  pull_request:
    paths:
      - internal/provider/smi/**
      - .github/workflows/fuzz.yml
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: How long to fuzz
        default: "600"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Fuzz the parsers
        run: |
          secs="${{ github.event.inputs.seconds || (github.event_name == 'pull_request' && '120' || '600') }}"
          go test ./internal/provider/smi/ -run xxx -fuzz FuzzParsers -fuzztime "${secs}s"
      # A crash is only useful with the input that caused it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-corpus
          path: internal/provider/smi/testdata/fuzz/
          retention-days: 7
